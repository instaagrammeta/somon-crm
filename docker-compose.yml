# ============================================================================
# Somon CRM v-2 — full production stack.
#
# Quick start:
#   1. cp .env.example .env  (then edit at least JWT_SECRET, DB_PASSWORD,
#                             ADMIN_PASSWORD, AI_API_KEY)
#   2. docker compose up -d --build
#   3. Open http://<server-ip>/         (public website + CRM login)
#
# Or one-liner:
#   ./bootstrap.sh
#
# Services:
#   postgres   — Postgres 16
#   redis      — Redis 7 (sessions, JWT blacklist, presence cache)
#   backend    — Go (Gin + GORM + WebSocket hub + AI)
#   frontend   — Nuxt 4 SPA (CRM + public marketing site)
#   nginx      — TLS-ready reverse proxy, the only port exposed to the host
#
# Each service has a healthcheck so 'docker compose up' only returns healthy.
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: somon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-somon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-somon_secret_change_me}
      POSTGRES_DB: ${DB_NAME:-somon_crm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-somon} -d ${DB_NAME:-somon_crm}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [somon]

  redis:
    image: redis:7-alpine
    container_name: somon_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [somon]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: somon_backend
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      UPLOAD_DIR: /app/uploads
      RESET_ADMIN_PASSWORD: ${RESET_ADMIN_PASSWORD:-false}
    volumes:
      - uploads:/app/uploads
      - ./static:/app/static:ro       # APK + any static binaries
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The image is FROM alpine:3.20 → wget is available; curl is not.
      # Health endpoint pings DB + Redis, so a 200 means the whole stack is up.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/health | grep -q '\"ok\":true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [somon]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: somon_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NITRO_PORT: "3000"
      NITRO_HOST: 0.0.0.0
      # Browser-side base URL: empty → same-origin via nginx
      NUXT_PUBLIC_API_BASE: ""
      # Server-side (SSR fallback) base URL: Docker DNS to reach backend
      NUXT_API_BASE_INTERNAL: "http://backend:8080"
      NUXT_PUBLIC_DEFAULT_LOCALE: ${DEFAULT_LOCALE:-tg}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/ | head -c 1 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [somon]

  nginx:
    image: nginx:1.27-alpine
    container_name: somon_nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${PUBLIC_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/var/www/uploads:ro
      - ./static:/var/www/static:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/health | grep -q '\"ok\":true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [somon]

volumes:
  pgdata:
  redisdata:
  uploads:

networks:
  somon:
    driver: bridge
