# ============================================================================
# Somon CRM — production nginx reverse proxy.
#
# Layout:
#   /api/ws            → backend, with WebSocket Upgrade (CRITICAL — without
#                        Upgrade/Connection headers WS handshakes 400)
#   /api/              → backend (regular HTTP)
#   /uploads/          → served directly from the shared Docker volume
#   /static/apk/       → APK landing for the public website
#   /                  → Nuxt SPA (also handles HMR Upgrade in dev)
#
# All upstreams use Docker DNS so this file is identical on every host.
# ============================================================================

upstream backend_upstream  { server backend:8080;  }
upstream frontend_upstream { server frontend:3000; }

# Map for the WS upgrade header — keeps proxied non-WS requests working.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Public website + CRM both live behind this server, the SPA decides.
    client_max_body_size 50M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # Hide nginx version header.
    server_tokens off;

    # ---- Static uploads (images, voice notes, panoramas, APK) ------------
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # ---- WebSocket gateway (must come BEFORE /api/) -----------------------
    # The Go hub at /api/ws upgrades the connection. Without the explicit
    # Upgrade / Connection headers nginx serves a 1.0-style proxy that drops
    # the handshake.
    location /api/ws {
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Long-lived connection: 1h idle is generous for chats/kanban/notif.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # ---- REST API ---------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ---- Health endpoint for load balancers ------------------------------
    location = /health {
        proxy_pass http://backend_upstream/health;
        access_log off;
    }

    # ---- Nuxt SPA (everything else) --------------------------------------
    # The Upgrade headers are kept here for Nuxt's dev-mode HMR; in production
    # they are simply ignored (no Upgrade header → connection_upgrade=close).
    location / {
        proxy_pass         http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
